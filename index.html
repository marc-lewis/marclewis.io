<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The personal homepage of Marc Lewis. It's a minefield out there.">
    <title>Marc Lewis</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='4.5' width='12' height='7' rx='1.5' fill='none' stroke='%23333' stroke-width='1.5'/%3E%3C/svg%3E">
    <style>
        :root {
            --ink: #333333;
            --gap: 10px;
            --pop-duration: 650ms;
            --wipe-sweep: 900ms; /* total duration of the load wipe, top left to bottom right */
        }

        body {
            margin: 0;
            overflow: hidden;
        }

        /*
         * The wall: a sheet of buttons, oversized (150%) and rotated -3deg,
         * so its corners always sit past the edge of the viewport. The
         * buttons are laid in running bond, like brickwork: alternate
         * courses offset by half a button. The minesweeper field is an
         * island inside it.
         */

        .field {
            inset: 0;
            overflow: hidden;
            position: fixed;
            user-select: none;
        }

        .field__sheet {
            height: 150vh;
            left: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%) rotate(-3deg);
            width: 150vw;
        }

        /*
         * The button fakes depth with its border: resting state has a 2px
         * bottom edge, hover presses it flat, active pushes it in.
         */

        .btn {
            animation: pop var(--pop-duration) backwards;
            border: 1px solid var(--ink);
            border-bottom: 2px solid var(--ink);
            border-radius: 5px;
            box-sizing: content-box;
            color: var(--ink);
            display: block;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            padding: 10px 20px;
            position: absolute;
            text-align: center;
            text-decoration: none;
            width: 50px;
        }

        .btn:hover {
            border-bottom-width: 1px;
            transform: translateY(1px);
        }

        .btn:active {
            border-top-width: 2px;
            padding: 11px 20px 8px;
        }

        .field .btn {
            animation-delay: var(--d, 0ms);
        }

        /* after a resize the wall is rebuilt, without re-running the show */
        .field--instant .btn,
        .field--instant .btn::after {
            animation: none;
        }

        /*
         * The extruded bottom side: a pseudo-element painted just below
         * the button's real 2px bottom border. Growing it is pure paint,
         * so the button's layout box never changes size and the gaps
         * between buttons can never shift while the wave passes.
         */

        .btn::after {
            background: var(--ink);
            border-radius: 0 0 4px 4px;
            content: '';
            height: 0;
            left: 0;
            position: absolute;
            right: 0;
            top: calc(100% + 2px);
        }

        .field .btn::after {
            animation: popSide var(--pop-duration) backwards;
            animation-delay: var(--d, 0ms);
        }

        /*
         * The game face. Revealed cells sit flush in the wall with the
         * classic coloured count; flags and bombs invert the button -
         * the minefield was linkedin all along.
         */

        .cell--open,
        .cell--open:hover,
        .cell--open:active {
            background: #f0f0f0;
            border-bottom-width: 1px;
            border-top-width: 1px;
            font-weight: 700;
            padding: 10px 20px;
            transform: none;
        }

        .cell--n1 { color: #0000ff; }
        .cell--n2 { color: #008000; }
        .cell--n3 { color: #ff0000; }
        .cell--n4 { color: #000080; }
        .cell--n5 { color: #800000; }
        .cell--n6 { color: #008080; }
        .cell--n7 { color: #000000; }
        .cell--n8 { color: #999999; }

        .cell--flag,
        .cell--bomb {
            background: var(--ink);
            color: #ffffff;
        }

        .cell--boom {
            background: #ff0000;
            color: #ffffff;
        }

        /* the ring of wall buttons around the field, once the game begins */
        .cell--off,
        .cell--off:hover,
        .cell--off:active {
            border-bottom-width: 2px;
            border-top-width: 1px;
            cursor: default;
            opacity: 0.35;
            padding: 10px 20px;
            transform: none;
        }

        .field--won .btn {
            background: var(--ink);
            color: #ffffff;
        }

        /*
         * The load show. Each button fades in and leaps upward while
         * its extruded side grows tall then short beneath it.
         * Everything happens in transform and paint - the wall's
         * geometry stays frozen, so nothing settles or shifts at the end.
         */

        @keyframes pop {
            0%   { opacity: 0; transform: translateY(0); }
            18%  { opacity: 1; }
            55%  { transform: translateY(-5px); }
            75%  { transform: translateY(1px); }
            100% { transform: translateY(0); }
        }

        @keyframes popSide {
            0%   { height: 0; }
            55%  { height: 3px; }
            100% { height: 0; }
        }

        /*
         * The wall is decorative to assistive tech, so this is the one real
         * keyboard/screen-reader link. It sits off-screen until focused,
         * then slides in at the top left.
         */

        .escape {
            animation: none; /* never part of the load show; the transform below keeps it off-screen */
            left: 1rem;
            opacity: 0;
            pointer-events: none;
            position: fixed;
            top: 1rem;
            transform: translateX(-200%);
            transition: opacity 150ms, transform 150ms;
            z-index: 1;
        }

        .escape:focus,
        .escape:focus-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        @media (prefers-reduced-motion: reduce) {
            .btn,
            .field .btn::after {
                animation: none;
            }
        }
    </style>
</head>
<body>
<!-- get outta here! -->
<a class="btn escape" href="https://www.linkedin.com/in/marc-lewis-58a2b37b/">linkedin</a>
<div class="field" aria-hidden="true">
    <div class="field__sheet"></div>
</div>
<script>
(() => {
    'use strict';

    const LINK = 'https://www.linkedin.com/in/marc-lewis-58a2b37b/';
    const root = document.documentElement;
    const field = document.querySelector('.field');
    const sheet = document.querySelector('.field__sheet');

    const cssNumber = (name) =>
        parseFloat(getComputedStyle(root).getPropertyValue(name));

    let cells = [];
    let cols = 0;
    let rows = 0;
    let playCount = 0;
    let mineCount = 0;
    let flagsPlaced = 0;
    let initiated = false;
    let minesPlaced = false;
    let opened = 0;
    let over = false;

    const makeCell = (i, row, col) => {
        const el = document.createElement('a');
        el.className = 'btn';
        el.dataset.i = String(i);
        el.href = LINK;
        el.tabIndex = -1;
        el.textContent = 'linkedin';
        return { el, i, row, col, mine: false, open: false, flag: false, wall: true, count: 0 };
    };

    // neighbours live on the field only, and only where bricks truly touch:
    // a course neighbour each side, and two overlapping bricks above and below
    const neighbours = (cell) => {
        const around = [];
        const cross = cell.row % 2 === 0 ? [-1, 0] : [0, 1];
        const push = (row, col) => {
            if (row < 0 || col < 0 || row >= rows || col >= cols) return;
            const n = cells[row * cols + col];
            if (!n.wall) around.push(n);
        };
        push(cell.row - 1, cell.col + cross[0]);
        push(cell.row - 1, cell.col + cross[1]);
        push(cell.row + 1, cell.col + cross[0]);
        push(cell.row + 1, cell.col + cross[1]);
        push(cell.row, cell.col - 1);
        push(cell.row, cell.col + 1);
        return around;
    };

    const buildBoard = () => {
        const probe = sheet.appendChild(makeCell(0, 0, 0).el);
        const gap = cssNumber('--gap');
        const across = probe.offsetWidth + gap;
        const down = probe.offsetHeight + gap;
        probe.remove();
        const half = across / 2; // the running bond offset

        // the wall fills the oversized sheet, as it always has
        cols = Math.max(3, Math.floor(sheet.offsetWidth / across));
        rows = Math.max(3, Math.floor(sheet.offsetHeight / down));

        // the field: the largest island whose rotated box fits the viewport
        const tilt = 3 * Math.PI / 180;
        const margin = 24;
        const fits = (c, r) => {
            const w = c * across - gap + half; // odd courses reach half a button further
            const h = r * down - gap;
            return w * Math.cos(tilt) + h * Math.sin(tilt) <= innerWidth - 2 * margin
                && w * Math.sin(tilt) + h * Math.cos(tilt) <= innerHeight - 2 * margin;
        };

        let boardCols = 3;
        let boardRows = 3;
        outer:
        for (let c = Math.min(cols, Math.floor(innerWidth / across)); c >= 3; c -= 1) {
            for (let r = Math.min(rows, Math.floor(innerHeight / down)); r >= 3; r -= 1) {
                if (fits(c, r)) {
                    boardCols = c;
                    boardRows = r;
                    break outer;
                }
            }
        }
        boardCols = Math.min(boardCols, cols);
        boardRows = Math.min(boardRows, rows);
        const startCol = Math.floor((cols - boardCols) / 2);
        const startRow = Math.floor((rows - boardRows) / 2);

        // centre the island's true bounding box on the sheet's centre,
        // so the rotated board sits centred in the viewport (the odd
        // courses reach half a button further, which index-centring ignores)
        const islandW = boardCols * across - gap + half;
        const islandH = boardRows * down - gap;
        const originX = sheet.offsetWidth / 2 - startCol * across - islandW / 2;
        const originY = sheet.offsetHeight / 2 - startRow * down - islandH / 2;

        // the wipe runs diagonally from top left to bottom right: each
        // button waits in proportion to its travel along that diagonal
        const scale = cssNumber('--wipe-sweep') / Math.max(1, (cols - 1) * across + (rows - 1) * down);

        cells = [];
        for (let row = 0; row < rows; row += 1) {
            for (let col = 0; col < cols; col += 1) {
                const cell = makeCell(cells.length, row, col);
                cell.el.style.left = (originX + col * across + (row % 2 ? half : 0)) + 'px';
                cell.el.style.top = (originY + row * down) + 'px';
                cell.el.style.setProperty('--d', Math.round((col * across + row * down) * scale) + 'ms');
                const inField = col >= startCol && col < startCol + boardCols
                    && row >= startRow && row < startRow + boardRows;
                cell.wall = !inField;
                cells.push(cell);
            }
        }
        sheet.replaceChildren(...cells.map((cell) => cell.el));

        playCount = boardCols * boardRows;
        mineCount = Math.max(1, Math.round(playCount * 0.15));
        flagsPlaced = 0;
        initiated = false;
        minesPlaced = false;
        opened = 0;
        over = false;
    };

    // the first click anywhere on the wall lets the field define itself:
    // everything around it fades back into the scenery
    const initiate = () => {
        if (initiated) return;
        initiated = true;
        cells.forEach((cell) => {
            if (cell.wall) cell.el.classList.add('cell--off');
        });
    };

    /*
     * Mines go in after the first dig, kept out of a pocket around the
     * opening click: the first dig is always safe, and always clears.
     */

    const placeMines = (first) => {
        const safe = new Set([first.i, ...neighbours(first).map((n) => n.i)]);
        let placed = 0;
        let attempts = 0;
        while (placed < mineCount && attempts < cells.length * 20) {
            attempts += 1;
            const i = Math.floor(Math.random() * cells.length);
            const cell = cells[i];
            if (cell.wall || safe.has(i) || cell.mine) continue;
            cell.mine = true;
            placed += 1;
        }
        cells.forEach((cell) => {
            if (!cell.wall) cell.count = neighbours(cell).filter((n) => n.mine).length;
        });
        minesPlaced = true;
    };

    const revealCell = (cell) => {
        if (over || cell.open || cell.flag || cell.wall) return;
        if (!minesPlaced) placeMines(cell);

        cell.open = true;
        opened += 1;
        cell.el.classList.add('cell--open');

        if (cell.mine) {
            boom(cell);
            return;
        }

        if (cell.count) {
            cell.el.textContent = cell.count;
            cell.el.classList.add('cell--n' + cell.count);
        } else {
            // a space, not an empty string: an empty cell has no line box
            // and the button would shrink
            cell.el.textContent = '\u00a0';
            neighbours(cell).forEach(revealCell);
        }

        if (opened === playCount - mineCount) win();
    };

    const toggleFlag = (cell) => {
        if (over || cell.open || cell.wall) return;
        cell.flag = !cell.flag;
        flagsPlaced += cell.flag ? 1 : -1;
        cell.el.classList.toggle('cell--flag', cell.flag);
    };

    // clicking a revealed number with its flags placed digs the rest
    const chord = (cell) => {
        const around = neighbours(cell);
        if (around.filter((n) => n.flag).length !== cell.count) return;
        around.forEach((n) => {
            if (!n.flag && !n.open) revealCell(n);
        });
    };

    const leaveForLinkedIn = () => {
        over = true;
        setTimeout(() => { window.location.href = LINK; }, 1600);
    };

    const boom = (cell) => {
        cell.el.textContent = 'boom';
        cell.el.classList.add('cell--boom');
        cells.forEach((c) => {
            if (c.mine && !c.flag) c.el.classList.add('cell--bomb');
        });
        leaveForLinkedIn();
    };

    const win = () => {
        cells.forEach((c) => { c.el.textContent = 'linkedin'; });
        field.classList.add('field--won');
        leaveForLinkedIn();
    };

    // playing, not leaving: clicks on the wall stay on the page.
    // every route to LinkedIn is earned now.
    sheet.addEventListener('click', (event) => {
        const el = event.target.closest('a.btn');
        if (!el) return;
        event.preventDefault();
        if (over) return;
        initiate();
        const cell = cells[el.dataset.i];
        if (cell.wall) return;
        if (cell.open) chord(cell);
        else revealCell(cell);
    });

    sheet.addEventListener('contextmenu', (event) => {
        const el = event.target.closest('a.btn');
        if (!el) return;
        event.preventDefault(); // long-press on touch lands here too
        if (!over) toggleFlag(cells[el.dataset.i]);
    });

    sheet.addEventListener('auxclick', (event) => event.preventDefault());

    buildBoard();

    // a resize rebuilds the wall, but never mid-game
    let rebuild;
    addEventListener('resize', () => {
        clearTimeout(rebuild);
        rebuild = setTimeout(() => {
            if (initiated || minesPlaced || flagsPlaced || over) return;
            field.classList.add('field--instant');
            buildBoard();
        }, 150);
    });
})();
</script>
</body>
</html>
